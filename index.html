<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>TRINITAS 조립 기록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans+KR:wght@300;400;500;700&display=swap');
  :root {
    --bg: #0d0f0f; --surface: #151919; --surface2: #1c2222; --border: #2a3333;
    --accent: #4db8ff; --accent2: #ffd166; --warn: #ffd166; --text: #e8efef;
    --text2: #8a9e9e; --red: #ffc300; --tag-design: #3a7bd5; --tag-order: #ffd166;
    --tag-part: #4db8ff; --tag-memo: #a78bfa; --tag-idea: #ff9f43;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans KR', sans-serif; min-height: 100vh; overflow-x: hidden; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--accent); }
  .header-sub { font-size: 11px; color: var(--text2); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
  .header-right { display: flex; gap: 10px; align-items: center; }
  .nav { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
  .nav-btn { flex: 1; padding: 12px 8px; background: none; border: none; color: var(--text2); font-family: 'IBM Plex Sans KR', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; letter-spacing: 0.5px; }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .screen { display: none; padding: 20px; }
  .screen.active { display: block; }
  .session-bar { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
  .session-bar.active-session { border-color: var(--accent); background: rgba(77,184,255,0.05); }
  .session-info { font-size: 12px; color: var(--text2); font-family: 'IBM Plex Mono', monospace; }
  .session-info strong { color: var(--text); font-size: 14px; display: block; margin-bottom: 2px; }
  .session-dot { width: 12px; height: 12px; border-radius: 50%; background: #555; }
  .session-dot.recording { background: #ffc300; animation: pulse 1.2s infinite; box-shadow: 0 0 8px #ffc300; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 8px; border: none; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; letter-spacing: 0.3px; }
  .btn-primary { background: var(--accent); color: #000; width: 100%; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-danger { background: var(--red); color: #000; width: 100%; }
  .btn-outline { background: none; border: 1px solid var(--border); color: var(--text); width: 100%; }
  .btn-outline:active { background: var(--surface2); }
  .btn-sm { padding: 8px 14px; font-size: 12px; width: auto; }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--text2); letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }
  .form-select, .form-input, .form-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'IBM Plex Sans KR', sans-serif; font-size: 15px; padding: 14px 16px; outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
  .form-select:focus, .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 80px; }
  .record-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .record-panel-title { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--text2); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 16px; }
  .tag-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .tag-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--text2); font-size: 12px; font-family: 'IBM Plex Sans KR', sans-serif; cursor: pointer; transition: all 0.15s; }
  .tag-btn.selected-도면수정 { background: var(--tag-design); border-color: var(--tag-design); color: #fff; }
  .tag-btn.selected-조립순서 { background: var(--tag-order); border-color: var(--tag-order); color: #000; }
  .tag-btn.selected-부품변경 { background: var(--tag-part); border-color: var(--tag-part); color: #fff; }
  .tag-btn.selected-아이디어 { background: var(--tag-idea); border-color: var(--tag-idea); color: #000; }
  .tag-btn.selected-메모 { background: var(--tag-memo); border-color: var(--tag-memo); color: #fff; }
  .photo-thumb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
  .photo-thumb { aspect-ratio: 1; border-radius: 6px; overflow: hidden; position: relative; }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-thumb-del { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.7); border: none; color: #fff; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .add-photo-cell { aspect-ratio: 1; border-radius: 6px; border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text2); cursor: pointer; }
  .voice-btn { width: 100%; height: 56px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 14px; font-family: 'IBM Plex Sans KR', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.15s; margin-bottom: 12px; }
  .voice-btn.recording { background: rgba(255,195,0,0.1); border-color: var(--red); color: var(--red); }
  .voice-indicator { display: flex; gap: 3px; align-items: center; }
  .voice-bar { width: 3px; height: 12px; background: var(--red); border-radius: 2px; animation: voiceAnim 0.6s infinite alternate; }
  .voice-bar:nth-child(2) { animation-delay: 0.1s; height: 18px; }
  .voice-bar:nth-child(3) { animation-delay: 0.2s; height: 10px; }
  .voice-bar:nth-child(4) { animation-delay: 0.15s; height: 20px; }
  .voice-bar:nth-child(5) { animation-delay: 0.05s; height: 14px; }
  @keyframes voiceAnim { from{transform:scaleY(0.5)} to{transform:scaleY(1.3)} }
  input[type="file"] { display: none; }
  .entry-list { display: flex; flex-direction: column; gap: 12px; }
  .entry-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .entry-card-header { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .entry-tag { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 12px; font-family: 'IBM Plex Mono', monospace; }
  .tag-도면수정 { background: rgba(58,123,213,0.2); color: #6fa8e8; }
  .tag-조립순서 { background: rgba(255,209,102,0.2); color: #ffd166; }
  .tag-부품변경 { background: rgba(77,184,255,0.2); color: #4db8ff; }
  .tag-아이디어 { background: rgba(255,159,67,0.2); color: #ff9f43; }
  .tag-메모 { background: rgba(167,139,250,0.2); color: #a78bfa; }
  .entry-time { font-size: 11px; color: var(--text2); font-family: 'IBM Plex Mono', monospace; }
  .entry-card-body { padding: 12px 14px; }
  .entry-desc { font-size: 14px; line-height: 1.6; color: var(--text); margin-bottom: 8px; }
  .entry-photos { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .entry-photos img { height: 70px; border-radius: 6px; flex-shrink: 0; cursor: pointer; }
  .entry-del-btn { background: none; border: none; color: var(--text2); font-size: 16px; cursor: pointer; padding: 2px 6px; }
  .section-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text2); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .session-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .session-card-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .session-card-header:active { background: var(--surface2); }
  .session-meta { font-size: 12px; color: var(--text2); font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
  .session-card-body { padding: 14px 16px; border-top: 1px solid var(--border); display: none; }
  .session-card-body.open { display: block; }
  .count-badge { font-size: 11px; font-family: 'IBM Plex Mono', monospace; background: var(--surface2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 12px; color: var(--text2); }
  .ai-report { background: rgba(77,184,255,0.04); border: 1px solid rgba(77,184,255,0.2); border-radius: 10px; padding: 16px; margin-top: 16px; }
  .ai-report-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 1.5px; margin-bottom: 12px; }
  .ai-report-content { font-size: 13px; line-height: 1.8; color: var(--text); white-space: pre-wrap; }
  .ai-loading { display: flex; align-items: center; gap: 10px; color: var(--text2); font-size: 13px; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  .filter-chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--text2); font-size: 12px; font-family: 'IBM Plex Sans KR', sans-serif; white-space: nowrap; cursor: pointer; transition: all 0.15s; }
  .filter-chip.active { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
  .empty { text-align: center; padding: 48px 20px; color: var(--text2); font-size: 13px; line-height: 2; }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal img { max-width: 95vw; max-height: 90vh; border-radius: 8px; }
  .modal-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 24px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .sync-bar { padding: 8px 14px; border-radius: 8px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; margin-bottom: 14px; border: 1px solid var(--border); color: var(--text2); display: flex; align-items: center; justify-content: space-between; }
  .sync-bar.ok { border-color: rgba(77,184,255,0.4); color: #4db8ff; background: rgba(77,184,255,0.05); }
  .sync-bar.err { border-color: rgba(255,195,0,0.4); color: #ffc300; }
  .gap-8 { display: flex; flex-direction: column; gap: 8px; }
  .mt-12 { margin-top: 12px; } .mt-20 { margin-top: 20px; }
  .flex-row { display: flex; gap: 10px; }
  .flex-row .btn { flex: 1; }
  .entry-edit-form { background: var(--surface2); }
</style>
</head>
<body>
<div class="header">
  <div><div class="header-logo">TRINITAS</div><div class="header-sub">ASSEMBLY LOG</div></div>
  <div class="header-right">
    <button id="googleBtn" onclick="handleGoogleLogin()" style="background:none;border:1px solid var(--border);color:var(--text2);font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer;font-family:IBM Plex Mono,monospace;" disabled>&#x2601; &#xB85C;&#xB529;&#xC911;...</button>
    <div class="session-dot" id="sessionDot"></div>
  </div>
</div>
<div class="nav">
  <button class="nav-btn active" onclick="showScreen('record')">&#xAE30;&#xB85D;</button>
  <button class="nav-btn" onclick="showScreen('session')">&#xC138;&#xC158;</button>
  <button class="nav-btn" onclick="showScreen('history')">&#xC774;&#xB825;</button>
  <button class="nav-btn" onclick="showScreen('manual')">&#xB9E4;&#xB274;&#xC5BC;</button>
</div>
<div class="screen active" id="screen-record">
  <div class="sync-bar" id="syncBar">&#x2601; &#xB85C;&#xCEEC; &#xC800;&#xC7A5; &#xC911; &middot; &#xAD6C;&#xAE00; &#xB4DC;&#xB77C;&#xC774;&#xBE0C; &#xBBF8;&#xC5F0;&#xB3D9;</div>
  <div id="no-session">
    <div class="empty"><div class="empty-icon">&#x1F527;</div><div>&#xC9C4;&#xD589;&#xC911;&#xC778; &#xC870;&#xB9BD; &#xC138;&#xC158;&#xC774; &#xC5C6;&#xC2B5;&#xB2C8;&#xB2E4;<br>&#xC138;&#xC158;&#xC744; &#xC2DC;&#xC791;&#xD574;&#xC8FC;&#xC138;&#xC694;</div></div>
    <button class="btn btn-primary" onclick="showScreen('session')">&#xFF0B; &#xC0C8; &#xC138;&#xC158; &#xC2DC;&#xC791;</button>
  </div>
  <div id="active-session-ui" style="display:none">
    <div class="session-bar active-session">
      <div class="session-info"><strong id="active-session-label">-</strong><span id="active-session-time">-</span></div>
      <div class="session-dot recording"></div>
    </div>
    <div class="record-panel">
      <div class="record-panel-title">&#xC218;&#xC815;&#xC0AC;&#xD56D; &#xCD94;&#xAC00;</div>
      <div class="tag-selector">
        <button class="tag-btn" data-tag="&#xB3C4;&#xBA74;&#xC218;&#xC815;" onclick="selectTag(this)">&#xB3C4;&#xBA74;&#xC218;&#xC815;</button>
        <button class="tag-btn" data-tag="&#xC870;&#xB9BD;&#xC21C;&#xC11C;" onclick="selectTag(this)">&#xC870;&#xB9BD;&#xC21C;&#xC11C;</button>
        <button class="tag-btn" data-tag="&#xBD80;&#xD488;&#xBCC0;&#xACBD;" onclick="selectTag(this)">&#xBD80;&#xD488;&#xBCC0;&#xACBD;</button>
        <button class="tag-btn" data-tag="&#xC544;&#xC774;&#xB514;&#xC5B4;" onclick="selectTag(this)">&#xC544;&#xC774;&#xB514;&#xC5B4;</button>
        <button class="tag-btn" data-tag="&#xBA54;&#xBAA8;" onclick="selectTag(this)">&#xBA54;&#xBAA8;</button>
      </div>
      <div class="photo-thumb-grid" id="photoThumbGrid"><div class="add-photo-cell" onclick="triggerPhoto()">&#xFF0B;</div></div>
      <div class="flex-row" style="margin-bottom:12px">
        <button class="btn btn-outline btn-sm" onclick="triggerCamera()" style="flex:1">&#x1F4F7; &#xCC2C;&#xC601;</button>
        <button class="btn btn-outline btn-sm" onclick="triggerGallery()" style="flex:1">&#x1F5BC; &#xAE64;&#xB7EC;&#xB9AC;</button>
      </div>
      <input type="file" id="photoInputCamera" accept="image/*" capture="environment" multiple onchange="handlePhotos(this)">
      <input type="file" id="photoInputGallery" accept="image/*" multiple onchange="handlePhotos(this)">
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
        <span id="voiceBtnIcon">&#x1F399;</span><span id="voiceBtnText">&#xC74C;&#xC131;&#xC73C;&#xB85C; &#xC124;&#xBA85;&#xD558;&#xAE30;</span>
      </button>
      <div class="form-group">
        <label class="form-label">&#xB0B4;&#xC6A9;</label>
        <textarea class="form-textarea" id="entryDesc" placeholder="&#xC218;&#xC815; &#xB0B4;&#xC6A9;&#xC744; &#xC785;&#xB825;&#xD558;&#xC138;&#xC694;" rows="4"></textarea>
      </div>
      <button class="btn btn-primary" onclick="addEntry()">&#x2713; &#xD56D;&#xBAA9; &#xC800;&#xC7A5;</button>
    </div>
    <div class="section-title">&#xC774;&#xBC88; &#xC138;&#xC158; &#xAE30;&#xB85D; (<span id="entryCount">0</span>&#xAC74;)</div>
    <div class="entry-list" id="entryList"><div class="empty"><div class="empty-icon">&#x1F4CB;</div><div>&#xC544;&#xC9C1; &#xAE30;&#xB85D;&#xB41C; &#xD56D;&#xBAA9;&#xC774; &#xC5C6;&#xC2B5;&#xB2C8;&#xB2E4;</div></div></div>
  </div>
</div>
<div class="screen" id="screen-session">
  <div id="start-session-form">
    <div class="section-title">&#xC0C8; &#xC870;&#xB9BD; &#xC138;&#xC158;</div>
    <div class="form-group"><label class="form-label">&#xBAA8;&#xB378;</label>
      <select class="form-select" id="sessionModel">
        <option value="T2">T2 (2kg)</option><option value="T7" selected>T7 (7kg)</option><option value="T15">T15 (15kg)</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">&#xC2DC;&#xB9AC;&#xC5BC; / &#xD638;&#xAE30;</label><input class="form-input" id="sessionSerial" placeholder="&#xC608;: T7-2025-001 / 2&#xD638;&#xAE30;"></div>
    <div class="form-group"><label class="form-label">&#xB2F4;&#xB2F9;&#xC790;</label><input class="form-input" id="sessionWorker" placeholder="&#xC774;&#xB984;"></div>
    <div class="form-group"><label class="form-label">&#xBE44;&#xACE0;</label><textarea class="form-textarea" id="sessionNote" placeholder="&#xD2B9;&#xC774;&#xC0AC;&#xD56D;, &#xC5C5;&#xADF8;&#xB808;&#xC774;&#xB4DC; &#xBC84;&#xC804; &#xB4F1;"></textarea></div>
    <button class="btn btn-primary" onclick="startSession()">&#x25B6; &#xC138;&#xC158; &#xC2DC;&#xC791;</button>
  </div>
  <div id="end-session-form" style="display:none">
    <div class="section-title">&#xD604;&#xC7AC; &#xC138;&#xC158;</div>
    <div class="session-bar active-session" style="margin-bottom:20px">
      <div class="session-info"><strong id="session-end-label">-</strong><span id="session-end-time">-</span></div>
      <div class="session-dot recording"></div>
    </div>
    <div class="ai-report" id="aiReportArea" style="display:none">
      <div class="ai-report-title">&#x25B8; AI &#xBD84;&#xC11D; &#xB9AC;&#xD3EC;&#xD2B8;</div>
      <div class="ai-report-content" id="aiReportContent"></div>
    </div>
    <div class="mt-20 gap-8">
      <button class="btn btn-outline" onclick="generateReport()">&#x1F916; AI &#xB9AC;&#xD3EC;&#xD2B8; &#xC0DD;&#xC131;</button>
      <button class="btn btn-danger" onclick="endSession()">&#x25A0; &#xC138;&#xC158; &#xC885;&#xB8CC; &#xBC0F; &#xC800;&#xC7A5;</button>
    </div>
  </div>
</div>
<div class="screen" id="screen-history">
  <div class="section-title">&#xC804;&#xCCB4; &#xC870;&#xB9BD; &#xC774;&#xB825;</div>
  <div class="form-group" style="margin-bottom:12px">
    <input class="form-input" id="searchInput" placeholder="&#x1F50D; &#xB2E4;&#xC911; &#xD0A4;&#xC6CC;&#xB4DC; &#xAC80;&#xC0C9; (&#xC608;: T7 &#xD0ED; &#xC218;&#xC815;)" oninput="searchHistory(this.value)" style="font-size:14px">
  </div>
  <div class="filter-bar" id="filterBar">
    <button class="filter-chip active" onclick="filterHistory('all',this)">&#xC804;&#xCCB4;</button>
    <button class="filter-chip" onclick="filterHistory('T2',this)">T2</button>
    <button class="filter-chip" onclick="filterHistory('T7',this)">T7</button>
    <button class="filter-chip" onclick="filterHistory('T15',this)">T15</button>
    <button class="filter-chip" onclick="filterHistory('도면수정',this)">&#xB3C4;&#xBA74;&#xC218;&#xC815;</button>
    <button class="filter-chip" onclick="filterHistory('조립순서',this)">&#xC870;&#xB9BD;&#xC21C;&#xC11C;</button>
    <button class="filter-chip" onclick="filterHistory('부품변경',this)">&#xBD80;&#xD488;&#xBCC0;&#xACBD;</button>
    <button class="filter-chip" onclick="filterHistory('아이디어',this)">&#xC544;&#xC774;&#xB514;&#xC5B4;</button>
  </div>
  <div id="historyList"><div class="empty"><div class="empty-icon">&#x1F4C2;</div><div>&#xC800;&#xC7A5;&#xB41C; &#xC138;&#xC158;&#xC774; &#xC5C6;&#xC2B5;&#xB2C8;&#xB2E4;</div></div></div>
</div>
<div class="screen" id="screen-manual">
  <div class="section-title">&#xC791;&#xC5C5; &#xB9E4;&#xB274;&#xC5BC; &#xC0DD;&#xC131;</div>
  <div class="form-group"><label class="form-label">&#xB300;&#xC0C1; &#xBAA8;&#xB378;</label>
    <select class="form-select" id="manualModel">
      <option value="T2">T2</option><option value="T7" selected>T7</option><option value="T15">T15</option><option value="all">&#xC804;&#xCCB4;</option>
    </select>
  </div>
  <div class="form-group"><label class="form-label">&#xD3EC;&#xD568;&#xD560; &#xD56D;&#xBAA9;</label>
    <div class="tag-selector" id="manualTagFilter">
      <button class="tag-btn selected-도면수정" data-tag="도면수정" onclick="toggleManualTag(this)">&#xB3C4;&#xBA74;&#xC218;&#xC815;</button>
      <button class="tag-btn selected-조립순서" data-tag="조립순서" onclick="toggleManualTag(this)">&#xC870;&#xB9BD;&#xC21C;&#xC11C;</button>
      <button class="tag-btn selected-부품변경" data-tag="부품변경" onclick="toggleManualTag(this)">&#xBD80;&#xD488;&#xBCC0;&#xACBD;</button>
      <button class="tag-btn selected-아이디어" data-tag="아이디어" onclick="toggleManualTag(this)">&#xC544;&#xC774;&#xB514;&#xC5B4;</button>
      <button class="tag-btn selected-메모" data-tag="메모" onclick="toggleManualTag(this)">&#xBA54;&#xBAA8;</button>
    </div>
  </div>
  <button class="btn btn-primary" onclick="generateManual()">&#x1F916; AI &#xB9E4;&#xB274;&#xC5BC; &#xC0DD;&#xC131;</button>
  <div class="ai-report mt-20" id="manualOutput" style="display:none">
    <div class="ai-report-title">&#x25B8; &#xC0DD;&#xC131;&#xB41C; &#xB9E4;&#xB274;&#xC5BC;</div>
    <div class="ai-report-content" id="manualContent"></div>
    <div class="mt-12"><button class="btn btn-outline btn-sm" onclick="copyManual()">&#x1F4CB; &#xD074;&#xB9BD;&#xBCF4;&#xB4DC; &#xBCF5;&#xC0AC;</button></div>
  </div>
</div>
<div class="modal" id="imgModal" onclick="closeModal()">
  <button class="modal-close">&#x2715;</button>
  <img id="modalImg" src="">
</div>
<script>
let state = {
  currentSession: null, entries: [], sessions: [], currentPhotos: [],
  selectedTag: null, isRecording: false, recognition: null,
  manualSelectedTags: ['\uB3C4\uBA74\uC218\uC815','\uC870\uB9BD\uC21C\uC11C','\uBD80\uD488\uBCC0\uACBD','\uC544\uC774\uB514\uC5B4','\uBA54\uBAA8'],
};
const CLIENT_ID = '952808780758-hhsvtcmj43j455mduf471ppjnr702ug3.apps.googleusercontent.com';
const FILE_NAME = 'trinitas_assembly_data.json';
let gToken = null, gFileId = null;

loadData(); updateUI(); initGoogle();

function loadData() {
  try { const s = localStorage.getItem('trinitas_sessions'); if (s) state.sessions = JSON.parse(s); } catch(e) {}
}
function saveData() {
  try { localStorage.setItem('trinitas_sessions', JSON.stringify(state.sessions)); saveToDrive(state.sessions); }
  catch(e) { try { localStorage.setItem('trinitas_sessions', JSON.stringify(state.sessions.map(s=>({...s,entries:s.entries.map(e=>({...e,photos:[]}))})))); } catch(e2) { alert('\uC800\uC7A5 \uC2E4\uD328'); } }
}
function initGoogle() {
  let attempts = 0;
  const t = setInterval(() => {
    attempts++;
    if (typeof google !== 'undefined' && google.accounts) {
      clearInterval(t);
      const btn = document.getElementById('googleBtn');
      if (btn) { btn.textContent = '\u2601 \uB85C\uADF8\uC778'; btn.disabled = false; }
      const saved = sessionStorage.getItem('g_token');
      if (saved) { gToken = saved; setGBtn(true); setSyncBar('ok','\u2601 \uAD6C\uAE00 \uB4DC\uB77C\uC774\uBE0C \uC5F0\uB3D9\uB428 \u00B7 \uB3D9\uAE30\uD654 \uC911...'); loadFromDrive(); }
    } else if (attempts > 30) {
      clearInterval(t);
      const btn = document.getElementById('googleBtn');
      if (btn) { btn.textContent = '\u2601 \uB85C\uADF8\uC778'; btn.disabled = false; }
      setSyncBar('err','\u26A0 \uAD6C\uAE00 \uC2A4\uD06C\uB9BD\uD2B8 \uB85C\uB529 \uC2E4\uD328 \u00B7 \uC0C8\uB85C\uACE0\uCE68 \uD6C4 \uC2DC\uB3C4');
    }
  }, 500);
}
function handleGoogleLogin() {
  if (gToken) { gToken=null; gFileId=null; sessionStorage.removeItem('g_token'); setGBtn(false); setSyncBar('','\u2601 \uB85C\uCEEC \uC800\uC7A5 \uC911 \u00B7 \uAD6C\uAE00 \uB4DC\uB77C\uC774\uBE0C \uBBF8\uC5F0\uB3D9'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
    callback: async (resp) => {
      if (resp.error) { setSyncBar('err','\u26A0 \uB85C\uADF8\uC778 \uC2E4\uD328'); return; }
      gToken = resp.access_token; sessionStorage.setItem('g_token', gToken);
      setGBtn(true); setSyncBar('ok','\u2601 \uAD6C\uAE00 \uB4DC\uB77C\uC774\uBE0C \uC5F0\uB3D9\uB428 \u00B7 \uB3D9\uAE30\uD654 \uC911...'); await loadFromDrive();
    }
  });
  client.requestAccessToken();
}
function setGBtn(on) { const b=document.getElementById('googleBtn'); if(!b)return; b.textContent=on?'\u2601 \uC5F0\uB3D9\uB428':'\u2601 \uB85C\uADF8\uC778'; b.style.color=on?'#4db8ff':''; b.style.borderColor=on?'#4db8ff':''; }
function setSyncBar(cls,msg) { const b=document.getElementById('syncBar'); if(!b)return; b.className='sync-bar'+(cls?' '+cls:''); b.textContent=msg; }
async function findDriveFile() {
  const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${FILE_NAME}'+and+trashed=false&fields=files(id)`,{headers:{Authorization:'Bearer '+gToken}});
  const d = await r.json(); return d.files&&d.files.length>0?d.files[0].id:null;
}
async function loadFromDrive() {
  if (!gToken) return;
  try {
    gFileId = await findDriveFile();
    if (!gFileId) { setSyncBar('ok','\u2601 \uAD6C\uAE00 \uB4DC\uB77C\uC774\uBE0C \uC5F0\uB3D9\uB428 \u00B7 \uC0C8 \uD30C\uC77C \uC0DD\uC131 \uC608\uC815'); return; }
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${gFileId}?alt=media`,{headers:{Authorization:'Bearer '+gToken}});
    const data = await r.json();
    if (data&&Array.isArray(data)) { state.sessions=data; updateUI(); }
    setSyncBar('ok','\u2601 \uAD6C\uAE00 \uB4DC\uB77C\uC774\uBE0C \uB3D9\uAE30\uD654 \uC644\uB8CC \u00B7 '+formatTime(new Date().toISOString()));
  } catch(e) { setSyncBar('err','\u26A0 \uB4DC\uB77C\uC774\uBE0C \uB85C\uB4DC \uC2E4\uD328 \u00B7 \uB85C\uCEEC \uB370\uC774\uD130 \uC0AC\uC6A9 \uC911'); }
}
async function saveToDrive(data) {
  if (!gToken) return;
  try {
    const blob = new Blob([JSON.stringify(data)],{type:'application/json'});
    if (gFileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${gFileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},body:blob});
    } else {
      const meta = await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},body:JSON.stringify({name:FILE_NAME,mimeType:'application/json'})});
      const m = await meta.json(); gFileId = m.id;
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${gFileId}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+gToken,'Content-Type':'application/json'},body:blob});
    }
    setSyncBar('ok','\u2601 \uAD6C\uAE00 \uB4DC\uB77C\uC774\uBE0C \uC800\uC7A5 \uC644\uB8CC \u00B7 '+formatTime(new Date().toISOString()));
  } catch(e) { setSyncBar('err','\u26A0 \uB4DC\uB77C\uC774\uBE0C \uC800\uC7A5 \uC2E4\uD328 \u00B7 \uB85C\uCEEC\uC5D0\uB9CC \uC800\uC7A5\uB428'); }
}
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  const map={record:0,session:1,history:2,manual:3};
  document.querySelectorAll('.nav-btn')[map[name]].classList.add('active');
  if (name==='history') renderHistory('all');
}
function startSession() {
  const model=document.getElementById('sessionModel').value, serial=document.getElementById('sessionSerial').value||'-', worker=document.getElementById('sessionWorker').value||'-', note=document.getElementById('sessionNote').value;
  state.currentSession={id:Date.now(),model,serial,worker,note,startTime:new Date().toISOString(),endTime:null,entries:[],aiReport:''};
  state.entries=[]; updateUI(); showScreen('record');
}
function endSession() {
  if (!state.currentSession){alert('\uC9C4;&#xD589;\uC911\uC778; \uC138\uC158\uC774; \uC5C6\uC2B5\uB2C8\uB2E4;.');return;}
  if (!confirm('\uC138\uC158\uC744; \uC885\uB8CC\uD558\uACE0; \uC800\uC7A5\uD558\uC2DC\uACA0\uC2B5\uB2C8\uAE4C;?')) return;
  try {
    state.currentSession.endTime=new Date().toISOString();
    state.currentSession.entries=JSON.parse(JSON.stringify(state.entries));
    const r=document.getElementById('aiReportContent'); if(r&&r.textContent) state.currentSession.aiReport=r.textContent;
    const s=JSON.parse(JSON.stringify(state.currentSession)); state.sessions.unshift(s); saveData();
    alert('\uC800\uC7A5; \uC644\uB8CC;! \uD56D\uBAA9; '+s.entries.length+'\uAC74\uC774; \uC800\uC7A5\uB410\uC2B5\uB2C8\uB2E4;.');
  } catch(e){alert('\uC800\uC7A5; \uC624\uB958;: '+e.message);return;}
  state.currentSession=null; state.entries=[]; state.currentPhotos=[]; state.selectedTag=null;
  const a=document.getElementById('aiReportArea'),c=document.getElementById('aiReportContent');
  if(a)a.style.display='none'; if(c)c.textContent='';
  updateUI(); showScreen('history');
}
function selectTag(btn) {
  document.querySelectorAll('#screen-record .tag-btn').forEach(b=>b.className='tag-btn');
  btn.classList.add('selected-'+btn.dataset.tag); state.selectedTag=btn.dataset.tag;
}
function triggerPhoto(){document.getElementById('photoInputGallery').click();}
function triggerCamera(){document.getElementById('photoInputCamera').click();}
function triggerGallery(){document.getElementById('photoInputGallery').click();}
function handlePhotos(input) {
  Array.from(input.files).forEach(file=>{const r=new FileReader();r.onload=e=>{state.currentPhotos.push(e.target.result);renderPhotoThumbs();};r.readAsDataURL(file);});
  input.value='';
}
function renderPhotoThumbs() {
  const grid=document.getElementById('photoThumbGrid'); grid.innerHTML='';
  state.currentPhotos.forEach((src,i)=>{const d=document.createElement('div');d.className='photo-thumb';d.innerHTML=`<img src="${src}" onclick="openModal('${src}')"><button class="photo-thumb-del" onclick="removePhoto(${i})">\u2715</button>`;grid.appendChild(d);});
  const add=document.createElement('div');add.className='add-photo-cell';add.textContent='\uff0b';add.onclick=triggerPhoto;grid.appendChild(add);
}
function removePhoto(i){state.currentPhotos.splice(i,1);renderPhotoThumbs();}
function addEntry() {
  const desc=document.getElementById('entryDesc').value.trim();
  if(!desc&&state.currentPhotos.length===0){alert('\uB0B4\uC6A9; \uB610\uB294; \uC0AC\uC9C4\uC744; \uCD94\uAC00\uD574\uC8FC\uC138\uC694;.');return;}
  if(!state.selectedTag){alert('\uBD84\uB958\uB97C; \uC120\uD0DD\uD574\uC8FC\uC138\uC694;.');return;}
  state.entries.unshift({id:Date.now(),tag:state.selectedTag,desc,photos:[...state.currentPhotos],time:new Date().toISOString()});
  document.getElementById('entryDesc').value=''; state.currentPhotos=[]; state.selectedTag=null;
  document.querySelectorAll('#screen-record .tag-btn').forEach(b=>b.className='tag-btn');
  renderPhotoThumbs(); renderEntries();
}
function deleteEntry(id){if(!confirm('\uC0AD\uC81C\uD558\uC2DC\uACA0\uC2B5\uB2C8\uAE4C;?'))return;state.entries=state.entries.filter(e=>e.id!==id);renderEntries();}
function renderEntries() {
  const list=document.getElementById('entryList');
  document.getElementById('entryCount').textContent=state.entries.length;
  if(state.entries.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">\uD83D\uDCCB</div><div>\uC544\uC9C1; \uAE30\uB85D\uB41C; \uD56D\uBAA9\uC774; \uC5C6\uC2B5\uB2C8\uB2E4;</div></div>';return;}
  list.innerHTML=state.entries.map(e=>`<div class="entry-card"><div class="entry-card-header"><span class="entry-tag tag-${e.tag}">${e.tag}</span><div style="display:flex;align-items:center;gap:8px"><span class="entry-time">${formatTime(e.time)}</span><button class="entry-del-btn" onclick="deleteEntry(${e.id})">\u2715</button></div></div><div class="entry-card-body">${e.desc?`<div class="entry-desc">${e.desc}</div>`:''}${e.photos&&e.photos.length>0?`<div class="entry-photos">${e.photos.map(p=>`<img src="${p}" onclick="openModal('${p}')">`).join('')}</div>`:''}</div></div>`).join('');
}
function toggleVoice() {
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){alert('Safari \uB610\uB294; Chrome\uC744; \uC0AC\uC6A9\uD574\uC8FC\uC138\uC694;.');return;}
  if(state.isRecording){state.recognition&&state.recognition.stop();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  state.recognition=new SR(); state.recognition.lang='ko-KR'; state.recognition.continuous=true; state.recognition.interimResults=true;
  state.recognition.onstart=()=>{state.isRecording=true;const b=document.getElementById('voiceBtn');b.classList.add('recording');document.getElementById('voiceBtnText').textContent='\uB179\uC74C; \uC911;... (\uD0ED\uD558\uC5EC; \uC911\uC9C0;)';document.getElementById('voiceBtnIcon').innerHTML='<div class="voice-indicator"><div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div><div class="voice-bar"></div></div>';};
  state.recognition.onresult=(event)=>{let t='';for(let i=0;i<event.results.length;i++)t+=event.results[i][0].transcript;document.getElementById('entryDesc').value=t;};
  state.recognition.onend=()=>{state.isRecording=false;const b=document.getElementById('voiceBtn');b.classList.remove('recording');document.getElementById('voiceBtnText').textContent='\uC74C\uC131\uC73C\uB85C; \uC124\uBA85\uD558\uAE30;';document.getElementById('voiceBtnIcon').textContent='\uD83C\uDF99;';};
  state.recognition.start();
}
async function generateReport() {
  if(state.entries.length===0){alert('\uAE30\uB85D\uB41C; \uD56D\uBAA9\uC774; \uC5C6\uC2B5\uB2C8\uB2E4;.');return;}
  const ra=document.getElementById('aiReportArea'),rc=document.getElementById('aiReportContent');
  ra.style.display='block'; rc.innerHTML='<div class="ai-loading"><div class="spinner"></div>AI\uAC00; \uBD84\uC11D; \uC911\uC785\uB2C8\uB2E4;...</div>';
  const s=state.currentSession;
  const prompt=`\uCEE4\uD53C; \uB85C\uC2A4\uD130\uAE30; \uC81C\uC870; \uC804\uBB38\uAC00\uB85C\uC11C; TRINITAS ${s.model} \uC870\uB9BD; \uC218\uC815\uC0AC\uD56D\uC744; \uBD84\uC11D\uD558\uC5EC; \uBCF4\uACE0\uC11C\uB97C; \uC791\uC131\uD574\uC8FC\uC138\uC694;.\n\uBAA8\uB378;:${s.model} \uC2DC\uB9AC\uC5BC;:${s.serial} \uC77C\uC2DC;:${formatDate(s.startTime)} \uB2F4\uB2F9;:${s.worker}\n\uC218\uC815\uC0AC\uD56D;:\n${state.entries.map((e,i)=>`${i+1}.[${e.tag}] ${e.desc||'(\uD14D\uC2A4\uD2B8\uC5C6\uC74C;)'}`).join('\n')}\n\n1.\uC694\uC57D; 2.\uB3C4\uBA74\uC218\uC815; 3.\uC870\uB9BD\uC21C\uC11C\uC8FC\uC758;4.\uBD80\uD488\uBCC0\uACBD; 5.\uC544\uC774\uB514\uC5B4; 6.\uBA54\uBAA8; 7.\uB2E4\uC74C\uC870\uB9BD\uC2DC\uBC18\uC601\uC0AC\uD56D; \uC21C\uC73C\uB85C; \uC791\uC131;`;
  try {
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const data=await resp.json(); rc.textContent=data.content?.find(c=>c.type==='text')?.text||'\uBD84\uC11D; \uC2E4\uD328;';
  } catch(e){rc.textContent='\uC624\uB958\uAC00; \uBC1C\uC0DD\uD588\uC2B5\uB2C8\uB2E4;.';}
}
function renderHistory(filter) {
  const list=document.getElementById('historyList');
  let sessions=[...state.sessions];
  if(filter!=='all'){
    const tags=['\uB3C4\uBA74\uC218\uC815;','\uC870\uB9BD\uC21C\uC11C;','\uBD80\uD488\uBCC0\uACBD;','\uC544\uC774\uB514\uC5B4;','\uBA54\uBAA8;'];
    sessions=tags.includes(filter)?sessions.filter(s=>s.entries.some(e=>e.tag===filter)):sessions.filter(s=>s.model===filter);
  }
  if(sessions.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">\uD83D\uDCC2</div><div>\uD574\uB2F9; \uC870\uAC74\uC758; \uC138\uC158\uC774; \uC5C6\uC2B5\uB2C8\uB2E4;</div></div>';return;}
  list.innerHTML=sessions.map(s=>{
    const tc={};s.entries.forEach(e=>{tc[e.tag]=(tc[e.tag]||0)+1;});
    const badges=Object.entries(tc).map(([t,c])=>`<span class="entry-tag tag-${t}" style="font-size:10px;padding:2px 8px">${t} ${c}</span>`).join('');
    const ah=s.aiReport?`<div class="ai-report" style="margin-top:12px"><div class="ai-report-title">\u25B8 AI \uBD84\uC11D; \uB9AC\uD3EC\uD2B8;</div><div class="ai-report-content">${s.aiReport}</div></div>`:'';
    const entryHtml=s.entries.map(e=>`
      <div class="entry-card" style="margin-bottom:8px" id="ecard-${s.id}-${e.id}">
        <div class="entry-card-header">
          <span class="entry-tag tag-${e.tag}">${e.tag}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="entry-time">${formatTime(e.time)}</span>
            <button class="btn btn-outline btn-sm" style="padding:3px 8px;font-size:11px" onclick="startEditEntry(${s.id},${e.id})">\u270F\uFE0F</button>
            <button class="entry-del-btn" onclick="deleteEntryFromSession(${s.id},${e.id})">\u2715</button>
          </div>
        </div>
        <div class="entry-card-body" id="ebody-${s.id}-${e.id}">
          ${e.desc?`<div class="entry-desc">${e.desc}</div>`:''}
          ${e.photos&&e.photos.length>0?`<div class="entry-photos">${e.photos.map(p=>`<img src="${p}" onclick="openModal('${p}')">`).join('')}</div>`:''}
        </div>
        <div class="entry-edit-form" id="eedit-${s.id}-${e.id}" style="display:none;padding:12px 14px;border-top:1px solid var(--border)">
          <div class="tag-selector" style="margin-bottom:10px">
            ${['\uB3C4\uBA74\uC218\uC815;','\uC870\uB9BD\uC21C\uC11C;','\uBD80\uD488\uBCC0\uACBD;','\uC544\uC774\uB514\uC5B4;','\uBA54\uBAA8;'].map(t=>`<button class="tag-btn${e.tag===t?' selected-'+t:''}" data-tag="${t}" onclick="setEditTag(${s.id},${e.id},'${t}',this)">${t}</button>`).join('')}
          </div>
          <textarea class="form-textarea" id="etxt-${s.id}-${e.id}" style="margin-bottom:8px;min-height:60px">${e.desc||''}</textarea>
          <div style="margin-bottom:8px">
            <button class="btn btn-outline btn-sm" onclick="addPhotoToEntry(${s.id},${e.id})" style="width:100%">\uD83D\uDCF7 \uC0AC\uC9C4; \uCD94\uAC00;</button>
            <input type="file" id="ephoto-${s.id}-${e.id}" accept="image/*" multiple style="display:none" onchange="handleEntryPhoto(this,${s.id},${e.id})">
          </div>
          <div class="flex-row">
            <button class="btn btn-primary btn-sm" onclick="saveEditEntry(${s.id},${e.id})" style="flex:1">\uC800\uC7A5;</button>
            <button class="btn btn-outline btn-sm" onclick="cancelEditEntry(${s.id},${e.id})" style="flex:1">\uCDE8\uC18C;</button>
          </div>
        </div>
      </div>`).join('');
    return `<div class="session-card"><div class="session-card-header" onclick="toggleSession(this)"><div><div style="font-weight:600;font-size:15px">${s.model} \u00B7 ${s.serial}</div><div class="session-meta">${formatDate(s.startTime)} \u00B7 ${s.worker}</div><div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${badges}</div></div><span class="count-badge">${s.entries.length}\uAC74;</span></div><div class="session-card-body">${entryHtml}${ah}<div class="mt-12 gap-8"><button class="btn btn-outline btn-sm" onclick="copyForClaude(${s.id})" style="width:100%;background:rgba(77,184,255,0.1);border-color:#4db8ff;color:#4db8ff">\uD83E\uDD16 Claude\uB85C; \uBD84\uC11D\uD558\uAE30;</button><button class="btn btn-outline btn-sm" onclick="deleteSession(${s.id})" style="width:100%">\uD83D\uDDD1 \uC138\uC158; \uC0AD\uC81C;</button></div></div></div>`;
  }).join('');
}
function toggleSession(h){h.nextElementSibling.classList.toggle('open');}
function filterHistory(filter,chip){document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));chip.classList.add('active');renderHistory(filter);}
function searchHistory(keyword) {
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  if(!keyword.trim()){document.querySelector('.filter-chip').classList.add('active');renderHistory('all');return;}
  const keywords=keyword.trim().toLowerCase().split(/\s+/).filter(k=>k.length>0);
  const list=document.getElementById('historyList');
  const matched=state.sessions.filter(s=>{
    const txt=[s.model,s.serial,s.note||'',...s.entries.map(e=>e.desc||''),...s.entries.map(e=>e.tag)].join(' ').toLowerCase();
    return keywords.every(kw=>txt.includes(kw));
  });
  if(matched.length===0){list.innerHTML='<div class="empty"><div class="empty-icon">\uD83D\uDD0D</div><div>\uAC80\uC0C9; \uACB0\uACFC\uAC00; \uC5C6\uC2B5\uB2C8\uB2E4;</div></div>';return;}
  list.innerHTML=matched.map(s=>{
    const me=s.entries.filter(e=>e.desc&&keywords.some(kw=>e.desc.toLowerCase().includes(kw)));
    const tc={};s.entries.forEach(e=>{tc[e.tag]=(tc[e.tag]||0)+1;});
    const badges=Object.entries(tc).map(([t,c])=>`<span class="entry-tag tag-${t}" style="font-size:10px;padding:2px 8px">${t} ${c}</span>`).join('');
    const eh=me.map(e=>{let hl=e.desc;keywords.forEach(kw=>{hl=hl.replace(new RegExp(kw,'gi'),m=>`<mark style="background:#ffc300;color:#000;border-radius:2px;padding:0 2px">${m}</mark>`);});return `<div class="entry-card" style="margin-bottom:8px"><div class="entry-card-header"><span class="entry-tag tag-${e.tag}">${e.tag}</span><span class="entry-time">${formatTime(e.time)}</span></div><div class="entry-card-body"><div class="entry-desc">${hl}</div></div></div>`;}).join('');
    return `<div class="session-card"><div class="session-card-header" onclick="toggleSession(this)"><div><div style="font-weight:600;font-size:15px">${s.model} \u00B7 ${s.serial}</div><div class="session-meta">${formatDate(s.startTime)} \u00B7 ${s.worker}</div><div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${badges}</div></div><span class="count-badge" style="color:#ffc300">${me.length}\uAC74; \uB9E4\uCE6D;</span></div><div class="session-card-body open">${eh}</div></div>`;
  }).join('');
}
function startEditEntry(sid,eid){document.getElementById(`eedit-${sid}-${eid}`).style.display='block';document.getElementById(`ebody-${sid}-${eid}`).style.display='none';}
function cancelEditEntry(sid,eid){document.getElementById(`eedit-${sid}-${eid}`).style.display='none';document.getElementById(`ebody-${sid}-${eid}`).style.display='block';}
function setEditTag(sid,eid,tag,btn){const f=document.getElementById(`eedit-${sid}-${eid}`);f.querySelectorAll('.tag-btn').forEach(b=>{b.className='tag-btn';delete b.dataset.selected;});btn.classList.add('selected-'+tag);btn.dataset.selected='true';}
function addPhotoToEntry(sid,eid){document.getElementById(`ephoto-${sid}-${eid}`).click();}
function handleEntryPhoto(input,sid,eid){const s=state.sessions.find(s=>s.id===sid);if(!s)return;const e=s.entries.find(e=>e.id===eid);if(!e)return;if(!e.photos)e.photos=[];Array.from(input.files).forEach(file=>{const r=new FileReader();r.onload=ev=>{e.photos.push(ev.target.result);};r.readAsDataURL(file);});input.value='';}
function saveEditEntry(sid,eid){
  const s=state.sessions.find(s=>s.id===sid);if(!s)return;
  const e=s.entries.find(e=>e.id===eid);if(!e)return;
  const f=document.getElementById(`eedit-${sid}-${eid}`);
  const selBtn=f.querySelector('.tag-btn[data-selected="true"]');
  if(selBtn)e.tag=selBtn.dataset.tag;
  e.desc=document.getElementById(`etxt-${sid}-${eid}`).value.trim();
  saveData();renderHistory('all');
}
function deleteEntryFromSession(sid,eid){if(!confirm('\uC774; \uD56D\uBAA9\uC744; \uC0AD\uC81C\uD558\uC2DC\uACA0\uC2B5\uB2C8\uAE4C;?'))return;const s=state.sessions.find(s=>s.id===sid);if(!s)return;s.entries=s.entries.filter(e=>e.id!==eid);saveData();renderHistory('all');}
function copyForClaude(sid){
  const s=state.sessions.find(s=>s.id===sid);if(!s)return;
  const text=`TRINITAS ${s.model} \uC870\uB9BD; \uC138\uC158; \uBD84\uC11D; \uC694\uCCAD;\n\uBAA8\uB378;: ${s.model}\n\uC2DC\uB9AC\uC5BC;/\uD638\uAE30;: ${s.serial}\n\uB2F4\uB2F9\uC790;: ${s.worker}\n\uC870\uB9BD\uC77C\uC2DC;: ${formatDate(s.startTime)}\n${s.note?'\uBE44\uACE0;: '+s.note:''}\n\n\uC218\uC815;/\uAE30\uB85D; \uC0AC\uD56D; (${s.entries.length}\uAC74;):\n${s.entries.map((e,i)=>`${i+1}. [${e.tag}] ${e.desc||'(\uD14D\uC2A4\uD2B8; \uC5C6\uC74C;)'} (${formatTime(e.time)})`).join('\n')}\n\n\uC704; \uB0B4\uC6A9\uC744; \uBD84\uC11D\uD558\uC5EC; \uB2E4\uC74C\uC744; \uC791\uC131\uD574\uC8FC\uC138\uC694;:\n1. \uC694\uC57D;\n2. \uB3C4\uBA74\uC218\uC815; \uD56D\uBAA9;\n3. \uC870\uB9BD\uC21C\uC11C; \uC8FC\uC758\uC0AC\uD56D;\n4. \uBD80\uD488\uBCC0\uACBD; \uD56D\uBAA9;\n5. \uC544\uC774\uB514\uC5B4; \uBC0F; \uBA54\uBAA8;\n6. \uB2E4\uC74C; \uC870\uB9BD; \uC2DC; \uBC18\uC601\uC0AC\uD56D;`;
  navigator.clipboard.writeText(text).then(()=>{alert('\uD074\uB9BD\uBCF4\uB4DC\uC5D0; \uBCF5\uC0AC\uB410\uC2B5\uB2C8\uB2E4;!\n\nClaude \uB300\uD654\uCC3D\uC5D0; \uBD99\uC5EC\uB123\uAE30;(Ctrl+V)\uD558\uBA74; \uBC14\uB85C; \uBD84\uC11D\uD574\uB4DC\uB9BD\uB2C8\uB2E4;.');}).catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;height:60%;z-index:9999;background:#1c2222;color:#e8efef;border:1px solid #4db8ff;padding:16px;border-radius:8px;font-size:12px';document.body.appendChild(ta);ta.select();document.execCommand('copy');setTimeout(()=>document.body.removeChild(ta),3000);alert('\uBCF5\uC0AC\uB410\uC2B5\uB2C8\uB2E4;! Claude \uB300\uD654\uCC3D\uC5D0; \uBD99\uC5EC\uB123\uAE30;\uD558\uC138\uC694;.');});
}
function deleteSession(id){if(!confirm('\uC774; \uC138\uC158\uC744; \uC0AD\uC81C\uD558\uC2DC\uACA0\uC2B5\uB2C8\uAE4C;?'))return;state.sessions=state.sessions.filter(s=>s.id!==id);saveData();renderHistory('all');}
function toggleManualTag(btn){const tag=btn.dataset.tag,idx=state.manualSelectedTags.indexOf(tag);if(idx>-1){state.manualSelectedTags.splice(idx,1);btn.className='tag-btn';}else{state.manualSelectedTags.push(tag);btn.classList.add('selected-'+tag);}}
async function generateManual() {
  const model=document.getElementById('manualModel').value,tags=state.manualSelectedTags;
  if(tags.length===0){alert('\uD3EC\uD568\uD560; \uD56D\uBAA9\uC744; \uC120\uD0DD\uD574\uC8FC\uC138\uC694;.');return;}
  let sessions=state.sessions;if(model!=='all')sessions=sessions.filter(s=>s.model===model);
  const allEntries=sessions.flatMap(s=>s.entries.filter(e=>tags.includes(e.tag)).map(e=>({...e,model:s.model,serial:s.serial,date:s.startTime})));
  if(allEntries.length===0){alert('\uD574\uB2F9; \uC870\uAC74\uC758; \uAE30\uB85D\uC774; \uC5C6\uC2B5\uB2C8\uB2E4;.');return;}
  const out=document.getElementById('manualOutput'),con=document.getElementById('manualContent');
  out.style.display='block';con.innerHTML='<div class="ai-loading"><div class="spinner"></div>\uB9E4\uB274\uC5BC\uC744; \uC0DD\uC131; \uC911\uC785\uB2C8\uB2E4;...</div>';
  const prompt=`\uCEE4\uD53C; \uB85C\uC2A4\uD130\uAE30; \uC81C\uC870; \uC804\uBB38\uAC00\uB85C\uC11C; TRINITAS ${model==='\uC804\uCCB4;'?'\uC804\uBAA8\uB378;':model} \uC870\uB9BD; \uC774\uB825\uC744; \uBC14\uD0D5\uC73C\uB85C; \uC791\uC5C5; \uB9E4\uB274\uC5BC\uC744; \uC791\uC131\uD574\uC8FC\uC138\uC694;.\n\n\uC774\uB825;:\n${allEntries.map((e,i)=>`${i+1}.[${e.tag}][${e.model}\u00B7${e.serial}] ${e.desc||''}`).join('\n')}\n\n1.\uB3C4\uBA74\uC218\uC815\uC774\uB825; 2.\uC870\uB9BD\uC21C\uC11C\uC8FC\uC758\uC0AC\uD56D;(\uCCB4\uD06C\uB9AC\uC2A4\uD2B8;) 3.\uBD80\uD488\uBCC0\uACBD\uC774\uB825; 4.\uC544\uC774\uB514\uC5B4; 5.\uC791\uC5C5\uD301; \uC21C\uC73C\uB85C; \uC791\uC131;`;
  try {
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();con.textContent=data.content?.find(c=>c.type==='text')?.text||'\uC0DD\uC131; \uC2E4\uD328;';
  } catch(e){con.textContent='\uC624\uB958\uAC00; \uBC1C\uC0DD\uD588\uC2B5\uB2C8\uB2E4;.';}
}
function copyManual(){navigator.clipboard.writeText(document.getElementById('manualContent').textContent).then(()=>alert('\uD074\uB9BD\uBCF4\uB4DC\uC5D0; \uBCF5\uC0AC\uB418\uC5C8\uC2B5\uB2C8\uB2E4;.'));}
function updateUI() {
  const h=!!state.currentSession;
  document.getElementById('no-session').style.display=h?'none':'block';
  document.getElementById('active-session-ui').style.display=h?'block':'none';
  document.getElementById('start-session-form').style.display=h?'none':'block';
  document.getElementById('end-session-form').style.display=h?'block':'none';
  document.getElementById('sessionDot').className='session-dot'+(h?' recording':'');
  if(h){const l=`${state.currentSession.model} \u00B7 ${state.currentSession.serial}`,t=formatDate(state.currentSession.startTime);document.getElementById('active-session-label').textContent=l;document.getElementById('active-session-time').textContent=t;document.getElementById('session-end-label').textContent=l;document.getElementById('session-end-time').textContent=t;}
  renderEntries();renderPhotoThumbs();
}
function openModal(src){document.getElementById('modalImg').src=src;document.getElementById('imgModal').classList.add('open');}
function closeModal(){document.getElementById('imgModal').classList.remove('open');}
function formatDate(iso){if(!iso)return'-';const d=new Date(iso);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}
function formatTime(iso){if(!iso)return'-';const d=new Date(iso);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
</script>
